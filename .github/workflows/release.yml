name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate tag version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match Android versionName $VERSION_NAME"
            exit 1
          fi

      - name: Build APK
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/LightUp-debug.apk
          body: |
            Download `LightUp-debug.apk` on an Android phone, allow installing unknown apps if Android asks, then open the APK to install Light Up.

            This is a debug-signed APK for open-source testing. A production release should be signed with a private release key.
