plugins {
    id "com.android.application"
}

android {
    namespace "com.lightup.alarm"
    compileSdk 35

    defaultConfig {
        applicationId "com.lightup.alarm"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "LightUp-${variant.name}.apk"
    }
}
